<script>
// wake logic lock
let wakeLock = null;

async function requestWakeLock() {
  if (!("wakeLock" in navigator)) {
    console.log("Wake Lock API not supported on this browser");
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => {
      console.log("wake lock released");
    });
  } catch (e) {
    console.log("wake lock request failed:", e.message);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && state.running) {
    await requestWakeLock();
  }
});

// title screen music
let titleStarted = false;

function tryStartTitle() {
  if (titleStarted) return;
  const t = document.getElementById("myAudio7");
  t.loop = true;
  t.volume = 0.4;
  t.play().then(() => { titleStarted = true; }).catch(() => {});
}

function stopTitle() {
  const t = document.getElementById("myAudio7");
  const steps = 15;
  let i = 0;
  const startVol = t.volume;
  const fade = setInterval(() => {
    i++;
    t.volume = Math.max(0, startVol * (1 - i / steps));
    if (i >= steps) {
      clearInterval(fade);
      t.pause();
      t.currentTime = 0;
    }
  }, 40);
}

const AMBIENT_VOL = 0.4;
let currentTrack = null;
const fadeTimers = {};

const seasonTrack = {
  spring: "myAudio1",
  summer: "myAudio5",
  fall:   "myAudio8",
  winter: "myAudio3",
};

function wantedTrack() {
  if (state.weather === "snow")  return "myAudio9";
  if (state.weather === "rain")  return "myAudio6";
  if (state.weather === "storm") return "myAudio4";
  if (state.weather === "cloudy") return "myAudio2";
  return seasonTrack[state.season] || "myAudio1";
}

function fadeTo(audio, target, ms, onDone) {
  clearInterval(fadeTimers[audio.id]);
  const steps = 20, start = audio.volume;
  let i = 0;
  fadeTimers[audio.id] = setInterval(() => {
    i++;
    audio.volume = Math.min(1, Math.max(0, start + (target - start) * (i / steps)));
    if (i >= steps) { clearInterval(fadeTimers[audio.id]); if (onDone) onDone(); }
  }, ms / steps);
}

function playTrack(id) {
  if (currentTrack === id) return;
  const prev = currentTrack ? document.getElementById(currentTrack) : null;
  currentTrack = id;

  const next = document.getElementById(id);
  next.loop = true;
  next.volume = 0;
  next.currentTime = 0;
  next.play()
    .then(() => fadeTo(next, AMBIENT_VOL, 2500))
    .catch(err => console.log("track blocked:", id, err.name));

  if (prev) fadeTo(prev, 0, 2000, () => prev.pause());
}

function stopAllMusic() {
  if (currentTrack) {
    const a = document.getElementById(currentTrack);
    fadeTo(a, 0, 2000, () => a.pause());
    currentTrack = null;
  }
}

function startMusicSystem() {
  playTrack(wantedTrack());
}

function onWeatherChanged() {
  if (!state.sleeping) playTrack(wantedTrack());
}

// ---------- SLEEP SCREEN ----------
function showSleepScreen() {
  document.getElementById("sleepScreen").style.display = "flex";
}
function hideSleepScreen() {
  document.getElementById("sleepScreen").style.display = "none";
}

function updateSleepCountdown() {
  if (!state.sleep_wake_at) return;
  const msLeft = state.sleep_wake_at - Date.now();
  if (msLeft <= 0) {
    document.getElementById("sleepCountdown").textContent = "waking up...";
    return;
  }
  const h = Math.floor(msLeft / 3600000);
  const m = Math.floor((msLeft % 3600000) / 60000);
  document.getElementById("sleepCountdown").textContent = `back in ~${h}h ${m}m`;
}

// wakes the client's *local view* once the timer's up — the server (cron)
// is the source of truth and already flipped sleeping=false in Firebase
function wakeUp() {
  state.sleeping = false;
  state.sleep_wake_at = null;
  state.current_line = "mm... good morning";
  state.last_line_seen = "";
  hideSleepScreen();
  if (!currentTrack) startMusicSystem();
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return `${h}h ${m}m ${s}s`;
}

function updateIdleScreen() {
  const now = new Date();

  // lines vanish after 5s in the game, so keep the last one visible here
  if (state.current_line) idleLastLine = state.current_line;

  document.getElementById("hp").textContent = "HP: " + state.hp;
  document.getElementById("hunger").textContent = "Hunger: " + Math.round(state.hunger);
  document.getElementById("mood").textContent = "Mood: " + state.mental_state;

  let sleepText = "Awake";
  if (state.sleeping) {
    const msLeft = Math.max(0, (state.sleep_wake_at || 0) - Date.now());
    const h = Math.floor(msLeft / 3600000);
    const m = Math.floor((msLeft % 3600000) / 60000);
    sleepText = `Sleeping (back in ~${h}h ${m}m)`;
  }
  document.getElementById("sleeping").textContent = sleepText;

  document.getElementById("clock").textContent = now.toLocaleTimeString();
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric",
  });
  document.getElementById("lilguyDialouge").textContent = idleLastLine ? `"${idleLastLine}"` : "...";
  document.getElementById("timeRunning").textContent = "Time together this session: " + formatDuration(state.session_seconds);
}

function resizeCanvas() {

  const scaleFactor = Math.min(window.innerWidth / 800, window.innerHeight / 600);
  const cssWidth = 800 * scaleFactor;
  const cssHeight = 600 * scaleFactor;

  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale((cssWidth / 800) * dpr, (cssWidth / 800) * dpr);
  ctx.font = "20px monospace";
  ctx.textBaseline = "top";
  canvasScale = cssWidth / 800;
}

function drainHunger() {
  const now = Date.now();

  lastHungerAt = now;
  state.hunger = Math.max(0, state.hunger - hours * mods.hunger_drain * hunger_drain_weather);

function checkUnlocks() {
  if (state.bond > state.highest_bond) state.highest_bond = state.bond;
  for (const tier of unlockTiers) {
    if (state.highest_bond >= tier.threshold && !state.unlocked_tiers.includes(tier.threshold)) {

      dialogue[tier.sprite] = tier.lines;
      state.current_line = tier.lines[0];
      state.line_display_timer = 0;
      saveToCloud();
    }
  }
}

function drawWrappedText(text, x, y, maxChars, lineHeight, color) {
  const words = text.split(" ");
  let line = "";
  let currentY = y;
  ctx.fillStyle = color;
  for (const word of words) {
    const testLine = line + word + " ";
    if (testLine.length > maxChars && line !== "") {
      ctx.fillText(line, x, currentY);
      line = word + " ";
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, currentY);
}

}

// ---------- WEATHER FETCH ----------
async function fetchWeather() {
  let lat = 0, lon = 0;
  try {
    const resp = await fetch("https://ipapi.co/json/");
    const data = await resp.json();
    lat = data.latitude;
    lon = data.longitude;
  } catch (e) {
    console.log("location lookup failed:", e);
  }

  let code = null;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const resp = await fetch(url);
    const data = await resp.json();
    code = data.current_weather.weathercode;
  } catch (e) {
    console.log("weather lookup failed:", e);
  }

  let weather;
  if (code === 0) weather = "clear";
  else if ([1, 2, 3].includes(code)) weather = "cloudy";
  else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) weather = "rain";
  else if ([71, 73, 75, 77, 85, 86].includes(code)) weather = "snow";
  else if ([95, 96, 99].includes(code)) weather = "storm";
  else weather = "clear";

  let drain = 1.0;
  if (weather === "rain") drain = 1.1;
  else if (weather === "storm") drain = 1.15;
  else if (weather === "snow") drain = 1.2;

  return { weather, drain };
}

// ---------- STARTUP ----------
let saveReady = false;   // only true once the real save has loaded
let loadFailed = false;
async function startup() {
  const month = new Date().getMonth() + 1;
  if ([12, 1, 2].includes(month)) state.season = "winter";
  else if ([3, 4, 5].includes(month)) state.season = "spring";
  else if ([6, 7, 8].includes(month)) state.season = "summer";
  else state.season = "fall";
  mods = season_modifiers[state.season];

  const w = await fetchWeather();
  state.weather = w.weather;
  hunger_drain_weather = w.drain;

  if (state.weather === "snow" && !state.seen_first_snow) {
    state.seen_first_snow = true;
    clearScreen(BLACK);
    drawText("...wait.", 300, 250, WHITE);
    await sleep(1800);
    clearScreen(BLACK);
    drawText("what IS that?", 260, 250, WHITE);
    await sleep(1800);
    clearScreen(BLACK);
    drawText("it's so quiet. and everything's turning white.", 130, 250, "rgb(200,220,255)");
    await sleep(2500);
    clearScreen(BLACK);
    drawText("i've never seen anything like this before.", 150, 250, "rgb(200,220,255)");
    await sleep(2500);
    state.bond += 8;
    checkUnlocks();
  }

  const saved = await loadSave();
  const today = dateOnlyUTC(new Date());

  if (saved) {
    state.mental_state = saved.mental_state ?? state.mental_state;
    state.mood = saved.mood ?? state.mood;
    state.event_running = saved.event_running ?? false;
    state.hp = saved.hp ?? state.hp;
    state.x = saved.x_pos ?? state.x;
    state.y = saved.y_pos ?? state.y;
    state.streak = saved.streak ?? 0;
    state.bond = saved.bond ?? 0;
    state.animation = saved.animation ?? 0;
    state.hunger = saved.hunger ?? state.hunger;
    state.pets_today = saved.pets_today ?? 8;
    state.save_num = saved.save_num ?? 0;
    state.highest_bond = saved.highest_bond ?? state.bond;
    state.unlocked_tiers = saved.unlocked_tiers ?? [];
    state.seen_first_snow = saved.seen_first_snow ?? false;

    // ---- sleep state, driven by the cron job ----
    state.sleep_wake_at = saved.sleep_wake_at ?? null;
    state.slept_today = saved.slept_today ?? null;
    const now = Date.now();
    if (state.sleep_wake_at && now < state.sleep_wake_at) {
      state.sleeping = true;
    } else {
      state.sleeping = false;
      state.sleep_wake_at = null;
    }

    for (const tier of unlockTiers) {
      if (state.unlocked_tiers.includes(tier.threshold)) {
        dialogue[tier.sprite] = tier.lines;
      }
    }

    if (saved.last_pet_str) {
      const lastPet = new Date(saved.last_pet_str);
      const hoursPassed = (Date.now() - lastPet.getTime()) / 3600000;
      state.pets_today = Math.min(8, state.pets_today + Math.floor(hoursPassed));
    }

if (saved.last_hunger_check) {
      const lastHunger = new Date(saved.last_hunger_check);
      const hoursPassed = (Date.now() - lastHunger.getTime()) / 3600000;
      state.hunger = Math.max(0, state.hunger - hoursPassed);
    }
    if (saved.last_open_date) {
      state.last_open_date = dateOnlyUTC(new Date(saved.last_open_date));
      state.gap = daysBetween(state.last_open_date, today);
      if (state.gap === 1) {
        state.save_num += 1;
      } else if (state.gap === 2) {
        state.streak += 1;
        state.save_num += 1;
        state.pets_today = 8;
      } else {
        state.streak = 1;
      }
    } else {
      state.streak = 1;
      state.gap = 999;
    }
  } else {
    state.streak = 1;
    state.gap = 999;
  }

  if (state.hunger <= 2) {
    state.mental_state = "bad";
    state.mood = 3;
  }

  const isNewDay = !state.last_open_date || daysBetween(state.last_open_date, today) !== 1;
  if (isNewDay) {
    const offDayChance = randInt(1, 10);
    const dailyLuck = randInt(1, 5);
    state.bond += dailyLuck;
    if (offDayChance === 1) state.mood = 3;
    else if (state.streak >= 3) state.mood = choice([1, 1, 2]);
    else state.mood = randInt(1, 2);
  }

  if (state.mood === 1) state.mental_state = "good";
  else if (state.mood === 3) state.mental_state = "bad";
  else state.mental_state = "neutral";

  clearScreen(BLACK);
  drawText("Made by your_local_robit and Claude.", 60, 300, YELLOW);
  await sleep(3000);
  clearScreen(BLACK);
  if (saved && (saved.save_code || saved.recovery_code)) {
    drawText("Save code: " + (saved.save_code || saved.recovery_code), 60, 330, YELLOW);
  }
  await sleep(3000);

  clearScreen(BLACK);
  let greeting;
  if (state.gap === 0) greeting = "back already? nice";
  else if (state.gap === 1) greeting = "hey! good to see you";
  else if (state.gap <= 3) greeting = "it's been a bit, welcome back";
  else greeting = "oh — hey. it's been a while";
  drawText(greeting, 60, 260, state.lilguy_color);
  await sleep(2000);

  lilguy_rect.x = state.x;

  // recheck weather periodically
  setInterval(async () => {
    const w2 = await fetchWeather();
    hunger_drain_weather = w2.drain;
    if (w2.weather !== state.weather) {
      state.weather = w2.weather;
      weather_particles = [];
      onWeatherChanged();
    }
  }, 10 * 60 * 1000);

  // catch a nap that started server-side while this tab is open
  setInterval(async () => {
    const s = await loadSave();
    if (!s) return;

    if (s.sleeping && !state.sleeping) {
      state.sleeping = true;
      state.sleep_wake_at = s.sleep_wake_at ?? null;
      state.slept_today = s.slept_today ?? null;
      state.current_line = "";
      stopAllMusic();
      showSleepScreen();
    } else if (!s.sleeping && state.sleeping) {
      wakeUp();
    }
  }, 5 * 60 * 1000);
 saveReady = !loadFailed;
  lastHungerAt = Date.now()
  mainLoop();
}

// ---------- MAIN LOOP ----------
function tick() {
  if (!state.running) return;

  // while asleep: just watch the clock, skip everything else
  if (state.sleeping) {
    lastHungerAt = Date.now()
    updateSleepCountdown();
    if (state.sleep_wake_at && Date.now() >= state.sleep_wake_at) {
      wakeUp();
    }
    return;
  }
  drainHunger();
  if (state.session_seconds % 3600 === 0 && state.session_seconds !== 0) {
  state.pets_today = Math.min(8, state.pets_today + 1);
}
  if (state.bond >= 100 * BOND_SCALE) state.lilguy_color = YELLOW;
  else if (state.bond >= 30 * BOND_SCALE) state.lilguy_color = "rgb(0,220,150)";
  else state.lilguy_color = GREEN;

  state.speech_timer += 1;
  if (state.speech_timer >= 120) {
    state.speech_timer = 0;
    if (randInt(1, 4) === 1 && state.mood !== 3) {
      state.current_line = choice(dialogue[state.season]);
    } else if (state.mood === 1) {
      state.current_line = choice(dialogue.happy);
    } else if (state.mood === 2) {
      state.current_line = choice(dialogue.neutral);
    } else {
      state.current_line = state.gap >= 1 ? choice(dialogue.angry_missed) : choice(dialogue.angry);
    }
  }

  if (state.current_line !== state.last_line_seen) {
    state.last_line_seen = state.current_line;
    state.line_display_timer = 0;
  } else if (state.current_line) {
    state.line_display_timer += 1;
    if (state.line_display_timer >= 5) {
      state.current_line = "";
      state.last_line_seen = "";
    }
  }

  if (!state.moment_active && !state.presence_moment_active && state.mood !== 3 && randInt(1, 1200) === 1 && idleTimer === null) {
    state.moment_active = true;
    state.moment_expires_at = state.session_seconds + 20;
    state.current_line = "hey... i found something. what should we do with it?";
  }
  if (state.moment_active && state.session_seconds >= state.moment_expires_at) {
    state.moment_active = false;
    state.current_line = "...guess it didn't matter that much.";
    state.mood = state.mood === 1 ? 2 : state.mood;
  }

  if (!state.moment_active && !state.presence_moment_active && state.mood !== 3 && randInt(1, 1800) === 1 && idleTimer === null) {
    state.presence_moment_active = true;
    state.presence_moment_expires_at = state.session_seconds + 12;
    state.current_line = "can you just... stay for a second?";
  }
  if (state.presence_moment_active && state.session_seconds >= state.presence_moment_expires_at) {
    state.presence_moment_active = false;
    state.current_line = "...thanks for staying.";
  }

  if (state.session_seconds % 30 === 0 || state.animation_seconds_override !== 0) {
    if (state.mood === 1) {
      const unlockedSprites = unlockTiers
        .filter(t => state.unlocked_tiers.includes(t.threshold))
        .map(t => t.sprite);
      const idle = choice(["walk", "wave", ...unlockedSprites]);
      if (idle === "walk") { state.lilstate = "_>"; state.lilstate1 = "<_"; state.animation = 1; }
      else if (idle === "wave") { state.lilstate = "0/"; state.lilstate1 = "0/"; state.animation = 3; }
      else {
        const tier = unlockTiers.find(t => t.sprite === idle);
        state.lilstate = tier.frames[0];
        state.lilstate1 = tier.frames[1];
      }
    } else {
      const idle = choice(["walk", "sit"]);
      if (idle === "walk") { state.lilstate = "_>"; state.lilstate1 = "<_"; state.animation = 1; }
      else { state.lilstate = "o"; state.lilstate1 = "o"; state.animation = 2; }
    }
  }
  state.session_seconds += 1;

  let text_surface = "_>";
  if (state.lilstate === "_>" && state.lilstate1 === "<_") {
    if (state.y === 1) {
      text_surface = "_>";
      state.x -= 10;
      if (state.x === 180) state.y = 0;
    } else {
      text_surface = "<_";
      state.x += 10;
      if (state.x === 600) state.y = 1;
    }
  } else if (state.lilstate === "0/" && state.lilstate1 === "0/") {
    text_surface = "0/";
  } else if (state.lilstate === "o" && state.lilstate1 === "o") {
    text_surface = "o";
  } else if (state.lilstate === "-.-" && state.lilstate1 === "-.-") {
    text_surface = "-.-";
  } else {
    const tier = unlockTiers.find(t => t.frames[0] === state.lilstate);
    if (tier) text_surface = tier.frames[0];
  }
  lilguy_rect = { x: state.x, y: 450, w: 30, h: 20 };

  draw(text_surface);
}

function draw(text_surface) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, 800, 600);
  ctx.clip();

  clearScreen(season_colors[state.season]);
  if (state.moment_active) {
    fillRect(keep_rect.x, keep_rect.y, keep_rect.w, keep_rect.h, "rgb(100,200,100)");
    drawText("keep it", keep_rect.x + 10, keep_rect.y + 10, BLACK);
    fillRect(share_rect.x, share_rect.y, share_rect.w, share_rect.h, "rgb(100,150,220)");
    drawText("give it", share_rect.x + 10, share_rect.y + 10, BLACK);
  }
  if (isNightTime()) {
    fillRect(goodnight_rect.x, goodnight_rect.y, goodnight_rect.w, goodnight_rect.h, "rgb(60,60,100)");
    drawText("zzz", goodnight_rect.x + 8, goodnight_rect.y + 15, WHITE);
  }

  if (state.mood === 1) drawText("mood :   :)", 140, 125, GREEN);
  else if (state.mood === 2) drawText("mood :  :|", 140, 125, YELLOW);
  else if (state.mood === 3) drawText("mood :   >:{", 140, 125, RED);

  if (state.current_line) {
    const clampedX = Math.min(state.x, 600);
    drawWrappedText(state.current_line, clampedX, 430, 20, 22, state.lilguy_color);
  }

  drawText(text_surface, state.x, 450, state.lilguy_color);

  const v = weather_visuals[state.weather];
  if (v) {
    if (v.mode === "fall") {
      if (randInt(1, v.spawn_chance) === 1) {
        weather_particles.push([randInt(0, 800), randInt(250, 400)]);
      }
      weather_particles.forEach(p => {
        p[1] += v.speed;
        drawText(v.char, p[0], p[1], v.color);
      });
      weather_particles = weather_particles.filter(p => p[1] < 600);
    } else if (v.mode === "drift") {
      if (randInt(1, v.spawn_chance) === 1) {
        weather_particles.push([-20, randInt(260, 400)]);
      }
      weather_particles.forEach(p => {
        p[0] += v.speed;
        drawText("~~~", p[0], p[1], v.color);
      });
      weather_particles = weather_particles.filter(p => p[0] < 850);
    } else if (v.mode === "sun") {
      drawText("* SUN *", 680, 260, v.color);
    }
  } else {
    weather_particles = [];
  }

  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 250);
  ctx.lineTo(800, 250);
  ctx.stroke();

  drawText(state.mental_state, 140, 180, GREEN);
  drawText(String(Math.round(state.hunger)), 230, 157, RED);
  drawText("HUNGER=", 140, 157, RED);
  drawText(relationshipDescriptor(), 140, 200, GREEN);
  fillRect(exit_rect.x, exit_rect.y, exit_rect.w, exit_rect.h, RED);
  fillRect(feed_rect.x, feed_rect.y, feed_rect.w, feed_rect.h, BLUE);
  fillRect(idle_rect.x, idle_rect.y, idle_rect.w, idle_rect.h, ORANGE);
  ctx.restore();
}

// ---------- INPUT ----------
function handleClick(clickX, clickY) {
  if (state.sleeping) return;

  if (state.moment_active) {
    if (pointInRect(clickX, clickY, keep_rect)) {
      state.bond += 2;
      state.hunger = Math.min(20, state.hunger + 4);
      state.current_line = "i'll hang on to this. thanks for letting me.";
      state.moment_active = false;
      checkUnlocks();
      saveToCloud();
      return;
    }
    if (pointInRect(clickX, clickY, share_rect)) {
      state.bond += 6;
      state.current_line = "i gave it away. felt kinda good actually.";
      state.moment_active = false;
      checkUnlocks();
      saveToCloud();
      return;
    }
  }

  // flavor-only "goodnight" line — real sleep is controlled server-side
  if (isNightTime() && pointInRect(clickX, clickY, goodnight_rect)) {
    state.current_line = choice([
      "goodnight. i'll be here when you wake up.",
      "sleep well. i mean it.",
      "night. today was a good one, i think.",
    ]);
    state.lilstate = "-.-";
    state.lilstate1 = "-.-";
    return;
  }

  if (pointInRect(clickX, clickY, exit_rect)) {
    state.running = false;
    stopAllMusic();
    clearScreen(season_colors[state.season]);
    let bye;
    if (state.mood === 1) bye = "bye!! come back soon ok? <3";
    else if (state.mood === 3) bye = "....bye.";
    else bye = "see you later.";
    drawText(bye, 180, 300, state.mood === 1 ? GREEN : state.mood === 3 ? RED : YELLOW);
    saveToCloud();
    clearScreen(BLACK);

    document.getElementById("exitMessage").textContent = bye;
    document.getElementById("exitScreen").style.display = "flex";
    releaseWakeLock();
    return;
  }

  if (pointInRect(clickX, clickY, lilguy_rect)) {
    if (state.pets_today > 0) {
      state.bond += Math.round(1 * mods.bond_mult);
      state.pets_today -= 1;
      state.current_line = choice(["hehe", ":)", "that's nice"]);
    } else {
      state.current_line = "ok ok that's enough pets for now";
    }
    saveToCloud();
    return;
  }

    if (pointInRect(clickX, clickY, feed_rect)) {
    if (state.hunger < 20) {
      const gained = Math.min(3, 20 - state.hunger);
      state.hunger += gained;
      state.bond += Math.round(gained * 2 * mods.bond_mult);
    }
    saveToCloud();
    return;
  }

  if (pointInRect(clickX, clickY, idle_rect)) {
    showIdleScreen();
    return;
  }
}
function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / canvasScale,
    y: (clientY - rect.top) / canvasScale,
  };
}


canvas.addEventListener("click", (e) => {
  const { x, y } = getCanvasCoords(e.clientX, e.clientY);
  handleClick(x, y);
});
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const { x, y } = getCanvasCoords(touch.clientX, touch.clientY);
  handleClick(x, y);
}, { passive: false });

// ---------- RUN ----------
let intervalId = null;
function mainLoop() {
  intervalId = setInterval(() => {
    tick();
    if (!state.running) clearInterval(intervalId);
  }, 1000);
}

const VAPID_PUBLIC_KEY = "BG96bnN1CxHVi1bD3sKv6bk91y7OTF5JkKyW-ZBkmUW3XRKCx_nmNIkZtYlYSqp3mMNX_MP4Td4oDW06gehU4U0";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

function subscriptionToPlainObject(subscription) {
  const toBase64Url = (buffer) => {
    if (!buffer) return null;
    const bytes = new Uint8Array(buffer);
    let binary = "";
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };

  let json = null;
  try {
    json = typeof subscription.toJSON === "function" ? subscription.toJSON() : null;
  } catch (e) {
    json = null;
  }

  if (json && json.endpoint && json.keys && json.keys.p256dh && json.keys.auth) {
    return json;
  }

  return {
    endpoint: subscription.endpoint,
    expirationTime: subscription.expirationTime ?? null,
    keys: {
      p256dh: toBase64Url(subscription.getKey ? subscription.getKey("p256dh") : null),
      auth: toBase64Url(subscription.getKey ? subscription.getKey("auth") : null),
    },
  };
}

async function setupPush() {
  if (!("serviceWorker" in navigator)) {
    alert("serviceWorker not supported");
    return;
  }
  if (!("PushManager" in window)) {
    alert("PushManager not supported — likely iOS version below 16.4, or not launched from Home Screen");
    return;
  }

  let registration;
  try {
    registration = await navigator.serviceWorker.register("./sw.js");
  } catch (e) {
    alert("service worker registration failed: " + e.message);
    return;
  }

  if (!("Notification" in window)) {
    alert("Notification API not available at all — must launch from Home Screen icon, not a Safari tab");
    return;
  }

  const permission = await Notification.requestPermission();
  alert("permission result: " + permission);

  if (permission !== "granted") return;

  let subscription = await registration.pushManager.getSubscription();
  if (!subscription) {
    subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }

  const subscriptionPayload = subscriptionToPlainObject(subscription);
  if (!subscriptionPayload.endpoint || !subscriptionPayload.keys || !subscriptionPayload.keys.p256dh || !subscriptionPayload.keys.auth) {
    alert("Push subscription looked incomplete on this device (missing endpoint/keys) — this can happen on some iOS versions. Try removing the app from your Home Screen, re-adding it, and enabling notifications again.");
    return;
  }

  const outgoingBody = JSON.stringify(subscriptionPayload);

  try {
    const resp = await fetch("/api/save-push", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: outgoingBody
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert("Couldn't save notification subscription: " + (err.error || resp.status));
      return;
    }

    alert("Notifications enabled!");
  } catch (e) {
    alert("Couldn't reach the server to save notification subscription: " + e.message);
  }
}

document.getElementById("userName").addEventListener("click", () => {
  const user = document.getElementById("userInput").value.trim();
  if (!user) return;
  state.username = user;
  alert("username is " + user);
});

document.getElementById("redeemBtn").addEventListener("click", async () => {
  const code = document.getElementById("recoveryInput").value;
  try {
    const resp = await fetch("/api/redeem-code", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const result = await resp.json();
    if (!resp.ok) {
      alert(result.error || "Code not recognized");
      return;
    }
    alert("Save linked! Reloading...");
    location.reload();
  } catch (e) {
    alert("Redeem failed: " + e.message);
  }
});
// autosave every minute while playing
setInterval(() => { if (state.running) saveToCloud(); }, 60000);

// save when the app goes to the background / screen locks (the reliable mobile signal)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && state.running) saveToCloud();
});

// backup for iOS Safari and tab closes
window.addEventListener("pagehide", () => { if (state.running) saveToCloud(); });
