<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Lil Guy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
  }
  canvas {
    image-rendering: pixelated;
    display: block;
  }
</style>
</head>
<body>
<button id="enableNotifs" style="position: fixed; top: 10px; left: 10px; z-index: 10; padding: 8px 12px; font-family: monospace;">
  Enable Notifications</button>
<div style="position: fixed; top: 60px; left: 10px; z-index: 10; font-family: monospace;">
  <input id="recoveryInput" placeholder="ABCD-EFGH-JKLM" style="padding: 6px;">
  <button id="redeemBtn">Load with code</button>
</div>
<div style="position: fixed; top: 90px; left: 10px; z-index: 10; font-family: monospace;">
  <input id="userInput" placeholder="Henry" style="padding: 6px;">
  <button id="userName">Enter a name</button>
</div>
<canvas id="game" width="800" height="900"></canvas>

<div id="startScreen" style="position:fixed;inset:0;z-index:20;
     background:#000;display:flex;flex-direction:column;
     align-items:center;justify-content:center;font-family:monospace;color:#fff;">
  <h1 style="letter-spacing:3px;font-size:32px;margin-bottom:24px;">LIL GUY</h1>
  <button id="playBtn" style="padding:14px 44px;font-size:18px;font-family:monospace;
       background:#00ff00;border:none;cursor:pointer;">PLAY</button>
</div>

<div id="exitScreen" style="display:none;position:fixed;inset:0;z-index:20;
     background:#000;flex-direction:column;
     align-items:center;justify-content:center;font-family:monospace;color:#fff;
     text-align:center;padding:20px;">
  <p id="exitMessage" style="font-size:22px;margin-bottom:28px;max-width:600px;"></p>
  <button id="playAgainBtn" style="padding:14px 44px;font-size:18px;font-family:monospace;
       background:#00ff00;border:none;cursor:pointer;">PLAY AGAIN</button>
</div>

<div id="idleScreen" style="display:none;position:fixed;inset:0;z-index:20;
     background:#000;overflow-y:auto;font-family:monospace;color:#fff;
     text-align:center;padding:40px 20px;box-sizing:border-box;">
  <style>
    #idleScreen p { font-size:22px; line-height:1.5; margin:0 0 44px 0; }

    /* phone in landscape: fit everything on one screen */
    @media (orientation: landscape) and (max-height: 500px) {
      #idleScreen { padding: 8px 16px !important; }
      #idleInner {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px 16px;
        width: 100%;
        max-width: none !important;
        align-items: center;
      }
      #idleScreen p { font-size: 18px; line-height: 1.3; margin: 0; }
      #idleScreen #lilguyDialouge { font-size: 20px; }
      #idleScreen #lilguyDialouge,
      #idleScreen #timeRunning,
      #idleScreen #exitIdle { grid-column: 1 / -1; justify-self: center; }
      #idleScreen #exitIdle { padding: 8px 32px !important; font-size: 16px !important; }
    }
  </style>

  <div id="idleInner" style="margin:auto;max-width:600px;display:flex;flex-direction:column;align-items:center;">
    <p id="level"></p>
    <p id="hp"></p>
    <p id="gear"></p>
    <p id="hunger"></p>
    <p id="mood"></p>
    <p id="sleeping"></p>
    <p id="clock"></p>
    <p id="date"></p>
    <p id="lilguyDialouge"></p>
    <p id="timeRunning"></p>
    <button id="exitIdle" style="padding:14px 44px;font-size:18px;font-family:monospace;
         background:#00ff00;color:#000;border:none;cursor:pointer;">Exit Idle mode</button>
  </div>
</div>
 <div id="sleepScreen" style="display:none;position:fixed;inset:0;z-index:20;
     background:#000;flex-direction:column;
     align-items:center;justify-content:center;font-family:monospace;color:#fff;
     text-align:center;padding:20px;">
  <p id="sleepMessage" style="font-size:22px;">lilguy is sleeping, check back in a little while!</p>
  <p id="sleepCountdown" style="font-size:14px;opacity:0.6;margin-top:8px;"></p>
</div>
