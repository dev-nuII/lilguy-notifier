name: Sync from source repo

on:
  workflow_dispatch:      # manual trigger button in the Actions tab
  schedule:
    - cron: '0 3 * * *'   # optional: daily at 3am UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: dev-nuii/Lilguy-Dev
          path: source
  

      - name: Overwrite files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='api/save-push.js' \
            --exclude='api/save-game.js' \
            --exclude='api/load-save.js' \
            --exclude='api/reset.js' \
            source/ target/

      - name: Commit and push changes
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync from source-repo"
          git push
